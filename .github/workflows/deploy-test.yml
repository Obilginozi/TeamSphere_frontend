name: Deploy Test Frontend

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint (non-blocking on test branch)
        run: npm run lint
        continue-on-error: true
      - name: Test (non-blocking on test branch)
        run: npm run test
        continue-on-error: true
      - run: npm run build

      - name: Deploy frontend to test server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          script: |
            cd /opt/teamsphere/TeamSphere_infrastructure
            chmod +x scripts/deploy-test.sh
            ./scripts/deploy-test.sh frontend
