name: CI

on:
  push:
    branches: [main, master, develop, test]
  pull_request:
    branches: [main, master, develop, test]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lint (required except test branch)
        if: github.ref_name != 'test'
        run: npm run lint
      - name: Lint (non-blocking on test branch)
        if: github.ref_name == 'test'
        run: npm run lint
        continue-on-error: true
      - name: Test (required except test branch)
        if: github.ref_name != 'test'
        run: npm run test
      - name: Test (non-blocking on test branch)
        if: github.ref_name == 'test'
        run: npm run test
        continue-on-error: true
      - run: npm run build

  trivy-dockerfile:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: ./Dockerfile
          severity: CRITICAL,HIGH
          exit-code: "0"
